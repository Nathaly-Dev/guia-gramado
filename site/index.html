  <main id="main" tabindex="-1">
    <section id="roteiro" class="screen" aria-labelledby="h-roteiro">
      <h1 id="h-roteiro" class="sr-only">Roteiro</h1>
      <div class="roteiro-grid">
        <div class="roteiro-side">
          <div id="live"></div>
          <div class="days" id="days" role="tablist" aria-label="Dias da viagem"></div>
        </div>
        <div class="roteiro-main">
          <div id="day"></div>
          <details class="sim" id="sim">
            <summary>Ver como o guia fica em outro dia e hora</summary>
            <div class="sim-row">
              <label>Dia <select id="simDay" class="field"></select></label>
              <label>Hora <input id="simTime" class="field" type="time" value="11:00"></label>
            </div>
            <div class="sim-row">
              <button id="simGo" class="btn" type="button">Simular</button>
              <button id="simOff" class="btn" type="button">Voltar ao horário real</button>
            </div>
          </details>
        </div>
      </div>
    </section>

    <section id="tempo" class="screen" aria-labelledby="h-tempo" hidden></section>
    <section id="voo" class="screen" aria-labelledby="h-voo" hidden></section>
    <section id="mala" class="screen" aria-labelledby="h-mala" hidden></section>
    <section id="dicas" class="screen" aria-labelledby="h-dicas" hidden></section>
